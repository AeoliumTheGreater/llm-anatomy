<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Anatomy</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <!-- top bar: title, preset toggle, edit controls -->
  <header class="topbar">
    <h1>LLM Anatomy</h1>
    <nav class="presets" aria-label="Presets"></nav>
    <div class="actions"></div>
  </header>

  <!-- palette, canvas and inspector -->
  <main class="workspace">
    <aside class="palette" aria-label="Block palette"></aside>
    <svg class="canvas" role="application" aria-label="Model graph"></svg>
    <aside class="inspector" aria-label="Inspector"></aside>
  </main>

  <!-- difference panel -->
  <section class="diffpanel" aria-label="Differences" hidden></section>
</body>
</html>
